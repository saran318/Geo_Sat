<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Geo-Sat Land Use Classifier{% endblock %}</title>
    
    <!-- Premium Fonts and Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Stitch Theme Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block head %}{% endblock %}
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="bi bi-globe-americas"></i>
                </div>
                <div class="brand-name">Geo-Sat</div>
            </div>
            
            <ul class="nav-menu">
                <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/analysis" class="nav-item {% if request.url.path == '/analysis' %}active{% endif %}">
                    <i class="bi bi-layers-fill"></i>
                    <span>Land Use Analysis</span>
                </a>
                <a href="/map" class="nav-item {% if request.url.path == '/map' %}active{% endif %}">
                    <i class="bi bi-map-fill"></i>
                    <span>Interactive Map</span>
                </a>
                <a href="/trends" class="nav-item {% if request.url.path == '/trends' %}active{% endif %}">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Trend Analysis</span>
                </a>
                <a href="/export" class="nav-item {% if request.url.path == '/export' %}active{% endif %}">
                    <i class="bi bi-file-earmark-pdf-fill"></i>
                    <span>Reports & Export</span>
                </a>
                <a href="/about" class="nav-item {% if request.url.path == '/about' %}active{% endif %}">
                    <i class="bi bi-info-circle-fill"></i>
                    <span>Project Info</span>
                </a>
            </ul>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            {% block content %}
            <!-- Child templates will inject their content here -->
            {% endblock %}
        </main>
    </div>

    <!-- Global State & API Logic -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
