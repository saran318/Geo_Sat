{% extends "base.html" %}
{% block title %}Interactive Map | Geo-Sat{% endblock %}
{% block content %}
<div class="mb-2 flex-between">
    <div>
        <h1>Interactive Map Viewer</h1>
        <p>Geospatial visualization of land cover classifications.</p>
    </div>
    <div>
        <select class="btn btn-secondary" style="background: var(--bg-color);">
            <option>Bengaluru, India</option>
            <option>Mumbai, India</option>
        </select>
    </div>
</div>
<div class="glass-card" style="height: 600px; padding: 0; overflow: hidden; position: relative;">
    <div class="flex-center" style="height: 100%; width: 100%; background: #1a2333;">
        <div style="text-align: center;">
            <i class="bi bi-map" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
            <p>Leaflet.js map integration scheduled for Phase 3</p>
        </div>
    </div>
</div>
{% endblock %}
