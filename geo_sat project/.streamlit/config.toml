[theme]
base                   = "dark"
primaryColor           = "#ffa198"
backgroundColor        = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor              = "#e6edf3"
font                   = "monospace"

[server]
# Required for Streamlit Cloud: allow large satellite imagery uploads
maxUploadSize          = 500          # MB
headless               = true         # Suppress "Run in browser" banner on Cloud
enableXsrfProtection   = true

[browser]
gatherUsageStats       = false        # Disable telemetry
